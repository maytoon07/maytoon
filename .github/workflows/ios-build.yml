name: iOS 앱 빌드 (시뮬레이터, 서명 없음)

# Mac이 없어도 GitHub의 macOS 러너로 iOS 프로젝트가 잘 컴파일되는지 확인하는 용도예요.
# 아직 Apple 개발자 계정(인증서/프로비저닝 프로파일)이 없어서 "서명"은 못 하고,
# 시뮬레이터용으로만 빌드해요 — 실기기 설치나 App Store 제출은 Apple 개발자 계정과
# 서명 인증서가 준비된 뒤 이 워크플로를 확장해서 진행해요.
#
# ※ 2026-10-24: GitHub macOS 러너(arm64·Intel 둘 다)가 계속 큐에서만 대기하고
#   끝나지 않는 문제 때문에 자동 실행(push 트리거)은 꺼둠. 필요할 때 Actions 탭에서
#   "Run workflow" 버튼으로 수동 실행하거나, Apple 개발자 계정 준비되면 다시 켤 것.
on:
  workflow_dispatch:

jobs:
  build:
    # macos-latest(arm64)는 요즘 용량 부족으로 큐가 오래 걸려서,
    # 용량이 넉넉한 Intel 러너(macos-13)를 대신 사용함.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: index.html을 www/로 복사 (Capacitor 웹 자산)
        run: cp index.html www/index.html

      - name: Capacitor 동기화
        run: |
          set +e
          npx cap sync ios > /tmp/cap-sync.log 2>&1
          code=$?
          set -e
          cat /tmp/cap-sync.log
          if [ "$code" != "0" ]; then
            echo "::error::Capacitor sync failed (exit $code), see lines below"
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/cap-sync.log
            exit $code
          fi
        shell: bash

      - name: CocoaPods 설치
        working-directory: ios/App
        run: pod install

      - name: 시뮬레이터용 빌드 (서명 없이 컴파일만 확인)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
